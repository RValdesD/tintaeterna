{% load moderation_tags %}
{% if user.is_authenticated %}
<details class="account-menu">
    <summary aria-label="Cuenta de {{ user.username }}">{{ user.username }}</summary>
    <div class="account-menu-panel">
        <a href="{% url 'pages:my_profile' %}">Mi perfil</a>
        <a href="{% url 'pages:account_settings' %}">Ajustes</a>
        <a href="{% url 'pages:bookmarks' %}">Mis marcadores</a>
        <a href="{% url 'pages:moderation_notices' %}">Avisos de moderación</a>
        {% if user|is_moderator %}<a href="{% url 'pages:moderation_dashboard' %}">Moderación</a>{% endif %}
        <form class="account-menu-logout" method="post" action="{% url 'pages:logout' %}">
            {% csrf_token %}
            <button type="submit">Cerrar Sesión</button>
        </form>
    </div>
</details>
{% endif %}
